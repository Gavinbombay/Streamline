[package]
name = "streamline"
version = "0.1.1"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"

[[bin]]
name = "streamline"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
streamline-conveyor = { path = "crates/streamline-conveyor" }
streamline-core = { path = "crates/streamline-core" }
streamline-http = { path = "crates/streamline-http" }
streamline-safe = { path = "crates/streamline-safe" }
streamline-store = { path = "crates/streamline-store" }
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[workspace]
members = [
    "crates/streamline-core",
    "crates/streamline-safe",
    "crates/streamline-store",
    "crates/streamline-conveyor",
    "crates/streamline-http",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["json", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
libc = "0.2"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
